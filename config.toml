[server]
host = "0.0.0.0"
port = 8080
max_upload_limit = 400
read_timeout_seconds = 900
write_timeout_seconds = 60
idle_timeout_seconds = 60
# Chunk size for the chunked upload flow (/api/v1/upload/init + chunk +
# complete). Keep this comfortably under any reverse proxy's per-request
# body cap in front of this server, e.g. Cloudflare's 100MB limit on
# Free/Pro/Business plans.
chunk_size_mb = 40

[storage]
base_path = "./storage/uploads"

[expiry_paths]
"1h" = "1h"
"12h" = "12h"
"24h" = "1d"
"72h" = "3d"

[database]
"mongodb_url" = "mongodb://localhost:27017/"
"db_name" = "tmpvault"